name: Verwaltung – Hilfe und FAQ

on:
  pull_request:
    branches:
      - entwicklung/phase-1-buchungen-sonderangebote-gps
  push:
    branches:
      - entwicklung/phase-1-buchungen-sonderangebote-gps
  workflow_dispatch:

permissions:
  contents: read

jobs:
  faq-inhalt-und-syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax der Hilfe prüfen
        run: node --check site/contextual-hilfe.js
      - name: Alle Verwaltungsbereiche, FAQ und Anmeldung prüfen
        run: node --test test/admin-help-faq.test.js

  faq-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Abhängigkeiten
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Chromium installieren
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Mobile Bedienbarkeit und Hilfe-Tooltips
        env:
          DATABASE_URL: ''
          RUN_SCHEMA_MIGRATIONS: 'false'
        run: node --test browser-tests/admin-help-faq.test.js
